name: Compilar Quipu

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar las librerías
        run: python -m pip install -r requirements.txt

      - name: Armar Quipu con PyInstaller
        run: pyinstaller Quipu.spec --clean --noconfirm

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Armar el instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" quipu.iss

      - name: Guardar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: Instalar-Quipu
          path: instalador/Instalar-Quipu.exe